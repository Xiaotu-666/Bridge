<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1020" width="1200" height="1020">
  <defs>
    <filter id="shadow" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="rootGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#283593"/>
      <stop offset="100%" stop-color="#1A237E"/>
    </linearGradient>
  </defs>

  <style>
    text { font-family: "Microsoft YaHei", "SimHei", "Noto Sans SC", sans-serif; }
    .edge { stroke: #7986CB; stroke-width: 2; fill: none; stroke-linecap: round; }
    .arrow { fill: #7986CB; }
  </style>

  <!-- 背景 -->
  <rect width="1200" height="1020" fill="#FAFAFA" rx="0"/>

  <!-- ===== 根节点 ===== -->
  <rect x="350" y="18" width="500" height="60" rx="10" fill="url(#rootGrad)" stroke="#0D1642" stroke-width="2" filter="url(#shadow)"/>
  <text x="600" y="56" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="bold">公路桥梁初始检查信息系统</text>

  <!-- ===== 连线 ===== -->
  <!-- 根节点中心：(600, 78) -->

  <!-- 连线到 sub1 -->
  <polyline points="600,78 600,108 310,108 310,140" class="edge"/>
  <polygon points="304,148 316,148 310,138" class="arrow"/>

  <!-- 连线到 sub2 -->
  <polyline points="600,78 600,108 890,108 890,140" class="edge"/>
  <polygon points="884,148 896,148 890,138" class="arrow"/>

  <!-- 连线到 sub3 -->
  <polyline points="600,78 600,118 310,118 310,410" class="edge"/>
  <polygon points="304,418 316,418 310,408" class="arrow"/>

  <!-- 连线到 sub4 -->
  <polyline points="600,78 600,118 890,118 890,410" class="edge"/>
  <polygon points="884,418 896,418 890,408" class="arrow"/>

  <!-- 连线到 sub5 -->
  <polyline points="600,78 600,128 310,128 310,680" class="edge"/>
  <polygon points="304,688 316,688 310,678" class="arrow"/>

  <!-- 连线到 sub6 -->
  <polyline points="600,78 600,128 890,128 890,680" class="edge"/>
  <polygon points="884,688 896,688 890,678" class="arrow"/>

  <!-- ===== 3.1.1 系统管理子系统 ===== -->
  <g transform="translate(30, 150)">
    <rect x="0" y="0" width="560" height="245" rx="10" fill="#E8EAF6" stroke="#5C6BC0" stroke-width="2" filter="url(#shadow)"/>
    <rect x="12" y="8" width="536" height="40" rx="6" fill="#C5CAE9" stroke="#5C6BC0" stroke-width="1"/>
    <text x="280" y="34" text-anchor="middle" fill="#1A237E" font-size="16" font-weight="bold">3.1.1 系统管理子系统</text>

    <!-- 功能项 -->
    <rect x="12" y="58" width="101" height="170" rx="6" fill="#FFFFFF" stroke="#9FA8DA" stroke-width="1.2"/>
    <text x="62" y="108" text-anchor="middle" fill="#333" font-size="12">用户管理</text>
    <text x="62" y="140" text-anchor="middle" fill="#666" font-size="10">新增/修改/启停</text>
    <text x="62" y="160" text-anchor="middle" fill="#666" font-size="10">密码重置</text>
    <text x="62" y="180" text-anchor="middle" fill="#666" font-size="10">首次强制改密</text>

    <rect x="120" y="58" width="101" height="170" rx="6" fill="#FFFFFF" stroke="#9FA8DA" stroke-width="1.2"/>
    <text x="170" y="108" text-anchor="middle" fill="#333" font-size="12">角色与权限</text>
    <text x="170" y="135" text-anchor="middle" fill="#666" font-size="10">RBAC 模型</text>
    <text x="170" y="155" text-anchor="middle" fill="#666" font-size="10">五类预置角色</text>
    <text x="170" y="175" text-anchor="middle" fill="#666" font-size="10">功能级+数据级</text>

    <rect x="228" y="58" width="101" height="170" rx="6" fill="#FFFFFF" stroke="#9FA8DA" stroke-width="1.2"/>
    <text x="278" y="108" text-anchor="middle" fill="#333" font-size="12">数据字典</text>
    <text x="278" y="140" text-anchor="middle" fill="#666" font-size="10">类型管理</text>
    <text x="278" y="160" text-anchor="middle" fill="#666" font-size="10">字典项管理</text>
    <text x="278" y="180" text-anchor="middle" fill="#666" font-size="10">启用/停用</text>

    <rect x="336" y="58" width="101" height="170" rx="6" fill="#FFFFFF" stroke="#9FA8DA" stroke-width="1.2"/>
    <text x="386" y="108" text-anchor="middle" fill="#333" font-size="12">备份与恢复</text>
    <text x="386" y="140" text-anchor="middle" fill="#666" font-size="10">手动/定时备份</text>
    <text x="386" y="160" text-anchor="middle" fill="#666" font-size="10">保留30天</text>
    <text x="386" y="180" text-anchor="middle" fill="#666" font-size="10">二次确认恢复</text>

    <rect x="444" y="58" width="101" height="170" rx="6" fill="#FFFFFF" stroke="#9FA8DA" stroke-width="1.2"/>
    <text x="494" y="108" text-anchor="middle" fill="#333" font-size="12">操作日志</text>
    <text x="494" y="140" text-anchor="middle" fill="#666" font-size="10">自动记录</text>
    <text x="494" y="160" text-anchor="middle" fill="#666" font-size="10">不可修改/删除</text>
    <text x="494" y="180" text-anchor="middle" fill="#666" font-size="10">6个月+归档</text>
  </g>

  <!-- ===== 3.1.2 桥梁基础信息管理子系统 ===== -->
  <g transform="translate(610, 150)">
    <rect x="0" y="0" width="560" height="245" rx="10" fill="#E8EAF6" stroke="#5C6BC0" stroke-width="2" filter="url(#shadow)"/>
    <rect x="12" y="8" width="536" height="40" rx="6" fill="#C5CAE9" stroke="#5C6BC0" stroke-width="1"/>
    <text x="280" y="34" text-anchor="middle" fill="#1A237E" font-size="16" font-weight="bold">3.1.2 桥梁基础信息管理子系统</text>

    <rect x="12" y="58" width="166" height="170" rx="6" fill="#FFFFFF" stroke="#9FA8DA" stroke-width="1.2"/>
    <text x="95" y="108" text-anchor="middle" fill="#333" font-size="13">桥梁信息管理</text>
    <text x="95" y="135" text-anchor="middle" fill="#666" font-size="11">基本状况卡片 CRUD</text>
    <text x="95" y="155" text-anchor="middle" fill="#666" font-size="11">按JTG 5120-2021附录A</text>
    <text x="95" y="175" text-anchor="middle" fill="#666" font-size="11">逻辑删除保护</text>

    <rect x="187" y="58" width="166" height="170" rx="6" fill="#FFFFFF" stroke="#9FA8DA" stroke-width="1.2"/>
    <text x="270" y="108" text-anchor="middle" fill="#333" font-size="13">桥梁档案管理</text>
    <text x="270" y="135" text-anchor="middle" fill="#666" font-size="11">上传/下载/预览</text>
    <text x="270" y="155" text-anchor="middle" fill="#666" font-size="11">交工验收资料</text>
    <text x="270" y="175" text-anchor="middle" fill="#666" font-size="11">设计/竣工图纸</text>

    <rect x="362" y="58" width="184" height="170" rx="6" fill="#FFFFFF" stroke="#9FA8DA" stroke-width="1.2"/>
    <text x="454" y="108" text-anchor="middle" fill="#333" font-size="13">桥梁照片管理</text>
    <text x="454" y="135" text-anchor="middle" fill="#666" font-size="11">桥面正面×1</text>
    <text x="454" y="155" text-anchor="middle" fill="#666" font-size="11">左侧立面×1</text>
    <text x="454" y="175" text-anchor="middle" fill="#666" font-size="11">右侧立面×1</text>
    <text x="454" y="195" text-anchor="middle" fill="#666" font-size="10">JPG/PNG ≤10MB</text>
  </g>

  <!-- ===== 3.1.3 检查任务管理子系统 ===== -->
  <g transform="translate(30, 420)">
    <rect x="0" y="0" width="560" height="245" rx="10" fill="#E8EAF6" stroke="#5C6BC0" stroke-width="2" filter="url(#shadow)"/>
    <rect x="12" y="8" width="536" height="40" rx="6" fill="#C5CAE9" stroke="#5C6BC0" stroke-width="1"/>
    <text x="280" y="34" text-anchor="middle" fill="#1A237E" font-size="16" font-weight="bold">3.1.3 检查任务管理子系统</text>

    <rect x="12" y="58" width="166" height="170" rx="6" fill="#FFFFFF" stroke="#9FA8DA" stroke-width="1.2"/>
    <text x="95" y="108" text-anchor="middle" fill="#333" font-size="13">任务创建与分配</text>
    <text x="95" y="135" text-anchor="middle" fill="#666" font-size="11">选择桥梁+检查类型</text>
    <text x="95" y="155" text-anchor="middle" fill="#666" font-size="11">检查等级设定</text>
    <text x="95" y="175" text-anchor="middle" fill="#666" font-size="11">多人分配</text>

    <rect x="187" y="58" width="166" height="170" rx="6" fill="#FFFFFF" stroke="#9FA8DA" stroke-width="1.2"/>
    <text x="270" y="108" text-anchor="middle" fill="#333" font-size="13">执行与状态跟踪</text>
    <text x="270" y="135" text-anchor="middle" fill="#666" font-size="11">待分配→进行中</text>
    <text x="270" y="155" text-anchor="middle" fill="#666" font-size="11">→已完成→已审核</text>
    <text x="270" y="175" text-anchor="middle" fill="#666" font-size="11">中途可取消</text>

    <rect x="362" y="58" width="184" height="170" rx="6" fill="#FFFFFF" stroke="#9FA8DA" stroke-width="1.2"/>
    <text x="454" y="108" text-anchor="middle" fill="#333" font-size="13">任务审核</text>
    <text x="454" y="135" text-anchor="middle" fill="#666" font-size="11">审核通过→锁定只读</text>
    <text x="454" y="155" text-anchor="middle" fill="#666" font-size="11">审核驳回→退回修正</text>
    <text x="454" y="175" text-anchor="middle" fill="#666" font-size="11">完整流转追溯链</text>
  </g>

  <!-- ===== 3.1.4 检查数据采集子系统 ===== -->
  <g transform="translate(610, 420)">
    <rect x="0" y="0" width="560" height="245" rx="10" fill="#E8EAF6" stroke="#5C6BC0" stroke-width="2" filter="url(#shadow)"/>
    <rect x="12" y="8" width="536" height="40" rx="6" fill="#C5CAE9" stroke="#5C6BC0" stroke-width="1"/>
    <text x="280" y="34" text-anchor="middle" fill="#1A237E" font-size="16" font-weight="bold">3.1.4 检查数据采集子系统</text>

    <rect x="12" y="58" width="125" height="170" rx="6" fill="#FFFFFF" stroke="#9FA8DA" stroke-width="1.2"/>
    <text x="74" y="108" text-anchor="middle" fill="#333" font-size="12">检测模板加载</text>
    <text x="74" y="140" text-anchor="middle" fill="#666" font-size="10">按桥型+等级</text>
    <text x="74" y="160" text-anchor="middle" fill="#666" font-size="10">自动筛选</text>
    <text x="74" y="180" text-anchor="middle" fill="#666" font-size="10">适用检测项</text>

    <rect x="145" y="58" width="125" height="170" rx="6" fill="#FFFFFF" stroke="#9FA8DA" stroke-width="1.2"/>
    <text x="207" y="108" text-anchor="middle" fill="#333" font-size="12">检测数据录入</text>
    <text x="207" y="135" text-anchor="middle" fill="#666" font-size="10">构件-检测项</text>
    <text x="207" y="155" text-anchor="middle" fill="#666" font-size="10">两级结构</text>
    <text x="207" y="175" text-anchor="middle" fill="#666" font-size="10">草稿/提交</text>
    <text x="207" y="195" text-anchor="middle" fill="#666" font-size="10">Web+移动端</text>

    <rect x="278" y="58" width="125" height="170" rx="6" fill="#FFFFFF" stroke="#9FA8DA" stroke-width="1.2"/>
    <text x="340" y="108" text-anchor="middle" fill="#333" font-size="12">数据校验</text>
    <text x="340" y="140" text-anchor="middle" fill="#666" font-size="10">完整性校验</text>
    <text x="340" y="160" text-anchor="middle" fill="#666" font-size="10">偏差>20%警告</text>
    <text x="340" y="180" text-anchor="middle" fill="#666" font-size="10">关联校验</text>

    <rect x="411" y="58" width="135" height="170" rx="6" fill="#FFFFFF" stroke="#9FA8DA" stroke-width="1.2"/>
    <text x="478" y="108" text-anchor="middle" fill="#333" font-size="12">交工验收</text>
    <text x="478" y="128" text-anchor="middle" fill="#333" font-size="12">数据导入</text>
    <text x="478" y="155" text-anchor="middle" fill="#666" font-size="10">避免重复检测</text>
    <text x="478" y="175" text-anchor="middle" fill="#666" font-size="10">来源标识</text>
    <text x="478" y="195" text-anchor="middle" fill="#666" font-size="10">修改变更原因</text>
  </g>

  <!-- ===== 3.1.5 缺损记录管理子系统 ===== -->
  <g transform="translate(30, 690)">
    <rect x="0" y="0" width="560" height="245" rx="10" fill="#E8EAF6" stroke="#5C6BC0" stroke-width="2" filter="url(#shadow)"/>
    <rect x="12" y="8" width="536" height="40" rx="6" fill="#C5CAE9" stroke="#5C6BC0" stroke-width="1"/>
    <text x="280" y="34" text-anchor="middle" fill="#1A237E" font-size="16" font-weight="bold">3.1.5 缺损记录管理子系统</text>

    <rect x="12" y="58" width="125" height="170" rx="6" fill="#FFFFFF" stroke="#9FA8DA" stroke-width="1.2"/>
    <text x="74" y="108" text-anchor="middle" fill="#333" font-size="12">缺损记录管理</text>
    <text x="74" y="135" text-anchor="middle" fill="#666" font-size="10">构件层级路径</text>
    <text x="74" y="155" text-anchor="middle" fill="#666" font-size="10">8种缺损类型</text>
    <text x="74" y="175" text-anchor="middle" fill="#666" font-size="10">4级缺损程度</text>
    <text x="74" y="195" text-anchor="middle" fill="#666" font-size="10">标度值1~5</text>

    <rect x="145" y="58" width="125" height="170" rx="6" fill="#FFFFFF" stroke="#9FA8DA" stroke-width="1.2"/>
    <text x="207" y="108" text-anchor="middle" fill="#333" font-size="12">示意图标注</text>
    <text x="207" y="140" text-anchor="middle" fill="#666" font-size="10">构件示意图上</text>
    <text x="207" y="160" text-anchor="middle" fill="#666" font-size="10">百分比坐标</text>
    <text x="207" y="180" text-anchor="middle" fill="#666" font-size="10">可视化展示</text>

    <rect x="278" y="58" width="125" height="170" rx="6" fill="#FFFFFF" stroke="#9FA8DA" stroke-width="1.2"/>
    <text x="340" y="108" text-anchor="middle" fill="#333" font-size="12">缺损照片</text>
    <text x="340" y="135" text-anchor="middle" fill="#666" font-size="10">整体照×1</text>
    <text x="340" y="155" text-anchor="middle" fill="#666" font-size="10">细节照×1</text>
    <text x="340" y="175" text-anchor="middle" fill="#666" font-size="10">自动缩略图</text>

    <rect x="411" y="58" width="135" height="170" rx="6" fill="#FFFFFF" stroke="#9FA8DA" stroke-width="1.2"/>
    <text x="478" y="108" text-anchor="middle" fill="#333" font-size="12">查询与统计</text>
    <text x="478" y="135" text-anchor="middle" fill="#666" font-size="10">多条件筛选</text>
    <text x="478" y="155" text-anchor="middle" fill="#666" font-size="10">按构件/类型/程度</text>
    <text x="478" y="175" text-anchor="middle" fill="#666" font-size="10">缺损分布概览图</text>
  </g>

  <!-- ===== 3.1.6 报告生成子系统 ===== -->
  <g transform="translate(610, 690)">
    <rect x="0" y="0" width="560" height="245" rx="10" fill="#E8EAF6" stroke="#5C6BC0" stroke-width="2" filter="url(#shadow)"/>
    <rect x="12" y="8" width="536" height="40" rx="6" fill="#C5CAE9" stroke="#5C6BC0" stroke-width="1"/>
    <text x="280" y="34" text-anchor="middle" fill="#1A237E" font-size="16" font-weight="bold">3.1.6 报告生成子系统</text>

    <rect x="12" y="58" width="125" height="170" rx="6" fill="#FFFFFF" stroke="#9FA8DA" stroke-width="1.2"/>
    <text x="74" y="108" text-anchor="middle" fill="#333" font-size="12">报告自动生成</text>
    <text x="74" y="140" text-anchor="middle" fill="#666" font-size="10">JTG标准格式</text>
    <text x="74" y="160" text-anchor="middle" fill="#666" font-size="10">PDF+Word</text>
    <text x="74" y="180" text-anchor="middle" fill="#666" font-size="10">数据完整性预检</text>

    <rect x="145" y="58" width="125" height="170" rx="6" fill="#FFFFFF" stroke="#9FA8DA" stroke-width="1.2"/>
    <text x="207" y="108" text-anchor="middle" fill="#333" font-size="12">报告审核</text>
    <text x="207" y="135" text-anchor="middle" fill="#666" font-size="10">在线预览</text>
    <text x="207" y="155" text-anchor="middle" fill="#666" font-size="10">电子签名</text>
    <text x="207" y="175" text-anchor="middle" fill="#666" font-size="10">二次密码验证</text>

    <rect x="278" y="58" width="125" height="170" rx="6" fill="#FFFFFF" stroke="#9FA8DA" stroke-width="1.2"/>
    <text x="340" y="108" text-anchor="middle" fill="#333" font-size="12">版本管理</text>
    <text x="340" y="135" text-anchor="middle" fill="#666" font-size="10">V1.0→V1.1</text>
    <text x="340" y="155" text-anchor="middle" fill="#666" font-size="10">→V2.0递增</text>
    <text x="340" y="175" text-anchor="middle" fill="#666" font-size="10">历史版本保留</text>

    <rect x="411" y="58" width="135" height="170" rx="6" fill="#FFFFFF" stroke="#9FA8DA" stroke-width="1.2"/>
    <text x="478" y="108" text-anchor="middle" fill="#333" font-size="12">修订与归档</text>
    <text x="478" y="135" text-anchor="middle" fill="#666" font-size="10">申请修订→新版本</text>
    <text x="478" y="155" text-anchor="middle" fill="#666" font-size="10">已归档锁定只读</text>
    <text x="478" y="175" text-anchor="middle" fill="#666" font-size="10">版本历史面板</text>
  </g>

  <!-- ===== 底部说明 ===== -->
  <text x="600" y="980" text-anchor="middle" fill="#999" font-size="11">图2.1 系统总体功能架构</text>
  <text x="1120" y="980" text-anchor="middle" fill="#BBB" font-size="9">B/S架构 · Spring Boot + Vue 3</text>

  <!-- ===== 图例 ===== -->
  <g transform="translate(30, 960)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="url(#rootGrad)"/>
